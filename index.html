<!DOCTYPE html>
<html lang="ko">
<head>

<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>

  darkMode: "class",
  theme: {

      colors: {
        "surface-container-highest": "#e3e2e6",
        "on-primary-fixed-variant": "#5a00c6",
        "tertiary-container": "#006e95",
        "surface-bright": "#faf9fd",
        "outline-variant": "#ccc3d8",
        "primary-fixed": "#eaddff",
        "error": "#ba1a1a",

<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen">
<header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
  <div class="h-14 px-margin-mobile flex items-center justify-between gap-2">
    <div class="flex-1 flex items-center bg-surface-container-high/80 rounded-full px-3 py-1.5 gap-2 border border-outline-variant/30">
      <span class="material-symbols-outlined text-[20px] text-primary">search</span>
      <input type="text" placeholder="강남역 주변 포토부스 검색..." class="w-full bg-transparent text-body-sm font-body-sm text-on-surface placeholder:text-on-surface-variant focus:outline-none"/>
    </div>
    <button aria-label="필터" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container text-on-surface hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined text-[20px]">tune</span>
    </button>
  </div>
</header>

<main class="flex flex-col relative w-full pt-14 pb-24 bg-surface min-h-screen">
  <div class="relative w-full h-[calc(100vh-56px-72px)] bg-slate-200 overflow-hidden">
    <!-- Map Background Image Simulation -->
    <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=1200&q=80" alt="Map View" class="w-full h-full object-cover opacity-80 filter saturate-150 contrast-125"/>

    <!-- Map Filter Pills -->
    <div class="absolute top-3 inset-x-0 z-10 px-margin-mobile flex gap-2 overflow-x-auto no-scrollbar">
      <button class="shrink-0 px-3.5 py-1.5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm shadow-md font-semibold">전체 부스</button>
      <button class="shrink-0 px-3.5 py-1.5 rounded-full bg-surface-container-lowest/90 backdrop-blur-md text-on-surface font-label-sm text-label-sm shadow-sm">🩵 하루필름</button>
      <button class="shrink-0 px-3.5 py-1.5 rounded-full bg-surface-container-lowest/90 backdrop-blur-md text-on-surface font-label-sm text-label-sm shadow-sm">🖤 인생네컷</button>
      <button class="shrink-0 px-3.5 py-1.5 rounded-full bg-surface-container-lowest/90 backdrop-blur-md text-on-surface font-label-sm text-label-sm shadow-sm">📸 포토이즘</button>
      <button class="shrink-0 px-3.5 py-1.5 rounded-full bg-surface-container-lowest/90 backdrop-blur-md text-on-surface font-label-sm text-label-sm shadow-sm">👀 돈룩업</button>
    </div>

    <!-- Map Markers -->
    <div class="absolute top-1/3 left-1/4 animate-pulse">
      <a href="page 2.html" class="flex flex-col items-center group">
        <span class="bg-primary text-on-primary text-[11px] font-bold px-2 py-0.5 rounded-full shadow-lg border border-white">하루필름 강남</span>
        <div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-md -mt-1 group-hover:scale-110 transition-transform">
          <span class="material-symbols-outlined text-[18px]">photo_camera</span>
        </div>
      </a>
    </div>

    <div class="absolute top-1/2 right-1/3">
      <a href="page 2.html" class="flex flex-col items-center group">
        <span class="bg-on-surface text-surface text-[11px] font-bold px-2 py-0.5 rounded-full shadow-lg border border-white">인생네컷 신논현</span>
        <div class="w-8 h-8 rounded-full bg-on-surface text-surface flex items-center justify-center shadow-md -mt-1 group-hover:scale-110 transition-transform">
          <span class="material-symbols-outlined text-[18px]">storefront</span>
        </div>
      </a>
    </div>

    <div class="absolute bottom-1/3 left-1/2">
      <a href="page 2.html" class="flex flex-col items-center group">
        <span class="bg-secondary text-on-secondary text-[11px] font-bold px-2 py-0.5 rounded-full shadow-lg border border-white">포토이즘 박스</span>
        <div class="w-8 h-8 rounded-full bg-secondary text-on-secondary flex items-center justify-center shadow-md -mt-1 group-hover:scale-110 transition-transform">
          <span class="material-symbols-outlined text-[18px]">auto_awesome</span>
        </div>
      </a>
    </div>

    <!-- My Location Button -->
    <button class="absolute right-4 bottom-32 w-11 h-11 rounded-full bg-surface-container-lowest shadow-lg text-on-surface flex items-center justify-center hover:bg-surface-container transition-all">
      <span class="material-symbols-outlined text-[22px] text-primary">my_location</span>
    </button>

    <!-- Bottom Selected Booth Card Sheet -->
    <div class="absolute bottom-4 inset-x-margin-mobile z-20 bg-surface-container-lowest/95 backdrop-blur-xl p-3.5 rounded-2xl shadow-xl border border-black/5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-16 h-16 rounded-xl bg-surface-container overflow-hidden shrink-0">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFZIug6uW67A0qcJVFz9Wo7lXYlXmoPhN-D8Gm085M9fueyfRIsE6UhO-1oFHptw7c36K6gK_UPgayZg0dStxKQybUkfFlqetp3Hx608F5DMA_isA6XODIpR73nA5t2Z-LFLq56arSm8VczY5wYL8nIjYNbLXGS2RITCb9GAvXDoeEtG37I5F_4Tc6JZDJ9w8Qcg90k7bau6oqqkfZwa3KEhh9nPRzcE9VT0dQTv1W9wnVijClGR4t" class="w-full h-full object-cover" alt="Haru Film"/>
        </div>
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="font-headline-sm text-[15px] font-bold text-on-surface truncate">하루필름 강남대로점</span>
            <span class="bg-tertiary-fixed text-on-tertiary-fixed text-[10px] font-bold px-1.5 py-0.2 rounded-full">여유</span>
          </div>
          <p class="font-body-sm text-[12px] text-on-surface-variant truncate">서울 강남구 강남대로 428 · 도보 3분</p>
          <div class="flex items-center gap-1 text-caption text-[11px] text-secondary font-semibold mt-0.5">
            <span class="material-symbols-outlined text-[14px]">star</span> 4.89 (142)
          </div>
        </div>
      </div>
      <a href="page 2.html" class="shrink-0 px-3.5 py-2 rounded-full bg-primary text-on-primary font-label-sm text-label-sm font-bold shadow-md hover:bg-primary/95 transition-transform active:scale-95">
        상세 보기
      </a>
    </div>
  </div>
</main>

<nav class="fixed bottom-0 inset-x-0 z-50 pb-safe px-margin-mobile pointer-events-none" data-active-classes="text-primary font-bold">
  <div class="pointer-events-auto mb-3 mx-auto max-w-md bg-surface-container-lowest/90 backdrop-blur-xl rounded-full shadow-[0_12px_32px_rgba(99,14,212,0.12),0_2px_8px_rgba(0,0,0,0.06)] px-space-xs py-1.5 flex items-center justify-between">
    <a aria-current="page" class="flex-1 flex flex-col items-center justify-center min-h-[44px] py-1 transition-all text-primary font-bold" data-path="booth-map" href="page 1.html">
      <span class="material-symbols-outlined text-[22px]">map</span>
      <span class="font-label-sm text-label-sm mt-0.5">부스 지도</span>
    </a>
    <a class="flex-1 flex flex-col items-center justify-center min-h-[44px] py-1 text-on-surface-variant transition-all hover:text-on-surface" data-path="booth-search" href="page 2.html">
      <span class="material-symbols-outlined text-[22px]">storefront</span>
      <span class="font-label-sm text-label-sm mt-0.5">부스 탐색</span>
    </a>
    <a class="flex-1 flex flex-col items-center justify-center min-h-[44px] py-1 text-on-surface-variant transition-all hover:text-on-surface" data-path="pose-gallery" href="page 3.html">
      <span class="material-symbols-outlined text-[22px]">photo_camera</span>
      <span class="font-label-sm text-label-sm mt-0.5">포즈 팁</span>
    </a>
    <a class="flex-1 flex flex-col items-center justify-center min-h-[44px] py-1 text-on-surface-variant transition-all hover:text-on-surface" data-path="my-album" href="page 4.html">
      <span class="material-symbols-outlined text-[22px]">photo_library</span>
      <span class="font-label-sm text-label-sm mt-0.5">내 앨범</span>
    </a>
  </div>
</nav>
</body>
</html>
